<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرات بيان في عالم العلوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f9ff;--card:#fff;--ink:#1d1b4b;--mute:#5b5a86;--sky:#2fa8e0;--vio:#6c4fd1;--tur:#17b9a8;--line:#dbe6f5;--ok:#168a52;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122e;--card:#1f1c45;--ink:#eef0ff;--mute:#aeb0dd;--line:#34306a;--ok:#4fd08c;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#14122e;--card:#1f1c45;--ink:#eef0ff;--mute:#aeb0dd;--line:#34306a;--ok:#4fd08c;--bad:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.8;font-size:17px}
h1,h2,h3{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;margin:0;line-height:1.4}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.top{background:linear-gradient(135deg,var(--vio),var(--sky) 70%,var(--tur));color:#fff;padding:22px 0 30px}
.top .wrap{display:flex;gap:18px;align-items:center}
.top h1{font-size:clamp(26px,5vw,44px)}
.top p{margin:4px 0 0;opacity:.95}
.bar{height:12px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tools input{flex:1;min-width:200px;min-height:44px;border-radius:12px;border:1px solid var(--line);padding:6px 14px;font:inherit;background:var(--card);color:var(--ink)}
.unit{margin:26px 0 10px;font-size:26px;color:var(--vio)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:right;display:block;width:100%}
.ch b{display:block;font-family:Lalezar;font-weight:400;font-size:21px;color:var(--ink)}
.ch small{color:var(--mute)}
.tag{display:inline-block;font-size:14px;padding:0 10px;border-radius:99px;background:#fff4d6;color:#7a5600;margin-top:6px}
.tag.ok{background:#d9f6ec;color:#0b6b4a}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:14px 0}
.tabs button{white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--vio);color:#fff;border-color:var(--vio)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.note{border-right:6px solid #e6a700;background:#fff8e1;color:#4d3900;padding:12px 16px;border-radius:12px}
.opt{display:block;width:100%;text-align:right;margin:8px 0}
.opt.right{background:#d9f6ec;border-color:var(--ok);color:#0b4f37}
.opt.wrong{background:#ffe3df;border-color:var(--bad);color:#6d160d}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pri{background:var(--vio);color:#fff;border-color:var(--vio)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px}
#map{min-width:560px;text-align:center}.mc{display:inline-block;background:var(--vio);color:#fff;padding:.5em 1.2em;border-radius:99px;font-family:Lalezar,Tajawal,sans-serif}.arr{color:var(--mute)}.brs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.7em;text-align:right}.br{border:2px solid var(--c);border-radius:14px;padding:.5em .8em}.br b{color:var(--c)}.br ul{margin:.3em 0 0;padding-inline-start:1.2em}.rq{padding:10px 0;border-bottom:1px solid var(--line)}details{margin-top:6px}summary{cursor:pointer;color:var(--vio);font-weight:700}
body{background:radial-gradient(900px 420px at 100% 0,rgba(47,168,224,.10),transparent 60%),radial-gradient(700px 360px at 0 35%,rgba(108,79,209,.08),transparent 60%),var(--bg)}
.top{position:relative;overflow:hidden;border-radius:0 0 36px 36px;padding:26px 0 42px}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.top::before{width:190px;height:190px;left:-50px;top:-70px}.top::after{width:110px;height:110px;left:24%;bottom:-55px}
.top .wrap{position:relative}
.hero-art{flex:none;width:112px;height:112px;background:rgba(255,255,255,.2);border-radius:50%;display:grid;place-items:center}
.ch{position:relative;border-inline-start:6px solid var(--c,var(--vio));display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.ch .ic{grid-row:span 4;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.ch .meter{grid-column:2;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.ch .meter i{display:block;height:100%;background:var(--c);border-radius:9px}
.ch .tag{grid-column:2;justify-self:start}
@media (hover:hover){.ch{transition:transform .2s,box-shadow .2s}.ch:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(60,50,140,.16)}}
.panel{box-shadow:0 2px 14px rgba(60,50,140,.06)}
.panel h3{color:var(--vio);margin:20px 0 6px;font-size:25px}.panel h3:first-child{margin-top:0}
.panel table{width:100%}.panel th{background:rgba(108,79,209,.13)}.panel td,.panel th{border:1px solid var(--line)!important;vertical-align:top}
.qbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 10px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--tur),var(--vio));transition:width .3s}
.opt{border-width:2px;transition:background .15s}
.tabs button[aria-selected=true]{box-shadow:0 3px 10px rgba(108,79,209,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#map{min-width:0;text-align:initial}
.mnode{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;padding:3px 10px;line-height:1.25;font-size:14.5px}
.mcen{background:var(--vio);color:#fff;font-family:Lalezar,Tajawal,sans-serif;font-size:19px;border-radius:20px;box-shadow:0 4px 14px rgba(108,79,209,.35)}
.mbr{background:var(--c);color:#fff;font-weight:700}
.mleaf{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));color:var(--ink)}
@media print{.top,.tools,.tabs,.row,button{display:none!important}body{background:#fff;color:#000}.panel{border:0}}
.hero-art{width:150px;height:150px;background:none;box-shadow:0 8px 22px rgba(40,20,110,.35),0 0 0 4px rgba(255,255,255,.55);overflow:hidden}
.hero-art img{width:100%;height:100%;display:block;object-fit:cover}
@media(max-width:560px){.hero-art{width:104px;height:104px}}

<li><b>اللابذرية:</b> لا تنتج بذورًا بل أبواغًا، ومنها السرخسيات مثل ذيل الحصان.</li></ul>
<p><b>الجذر:</b> يمتص الماء والأملاح المعدنية ويخزن الغذاء ويثبت النبات. من أجزائه القلنسوة والبشرة والقشرة وأوعية النقل. أنواعه: وتدية وليفية وهوائية.</p>

<li><b>التحول الناقص (ثلاث مراحل):</b> بيضة ← حورية ← بالغ، كما في الجرادة واليعسوب والنمل الأبيض. الحورية تشبه البالغ لكنها أصغر وتفتقر إلى الأجنحة وأعضاء التكاثر.</li></ul>

challenge:`<h3>تحدي العالمة الصغيرة 🔍</h3>
<p><b>لغز علمي:</b> أبدأ بيضة، ثم أصير يرقة تشبه الدودة، ثم تغلّفني شرنقة، ثم أخرج بأجنحة ملونة. من أنا؟<details><summary>الإجابة</summary>الفراشة، وهي تمر بتحول كامل.</details></p>
<p><b>تفكير ناقد:</b> لماذا لا تحتاج النباتات التي تعتمد على الرياح إلى جذب الحيوانات؟<details><summary>الإجابة</summary>لأن الرياح تنقل حبوب اللقاح من السداة إلى الكربلة، لذلك تكون أزهارها صغيرة وباهتة اللون.</details></p>
<p><b>موقف من الحياة:</b> رأيتِ نحلة تتنقل بين الأزهار وتمتص الرحيق. كيف تساعد النباتات؟<details><summary>الإجابة</summary>تلتصق حبوب اللقاح بجسمها وتنقلها إلى زهرة أخرى، فيحدث التلقيح.</details></p>
<p><b>تحدٍّ قصير:</b> رتّبي مراحل التحول الكامل.<details><summary>الإجابة</summary>بيضة، يرقة، عذراء، بالغ.</details></p>`});

summary:`<h3>الدرس الأول: العلاقات في الأنظمة البيئية</h3>
<p><b>النظام البيئي</b> يتشكل من المخلوقات الحية (العوامل الحيوية) والأشياء غير الحية (العوامل اللاحيوية) وتفاعلاتها معًا في بيئة معينة. وتتنافس المخلوقات الحية باستمرار على الموارد، ومنها المياه والغذاء والمأوى.</p>
<ul><li><b>العامل المحدد:</b> أي عنصر يتحكم في معدل نمو الجماعات الحيوية (زيادةً أو نقصانًا). ومن العوامل اللاحيوية المحددة: مياه الأمطار ودرجات الحرارة ونوع التربة والمأوى وضوء الشمس.</li>
<li><b>الجماعة الحيوية:</b> جميع أفراد النوع الواحد التي تعيش في نظام بيئي.</li>
<li><b>السعة التحملية:</b> أقصى عدد من أفراد الجماعة الحيوية يمكن لنظام بيئي دعمه وإعالته، وتحددها العوامل الحيوية واللاحيوية.</li>
<li><b>الموطن:</b> المكان الذي يعيش فيه المخلوق الحي ويحصل منه على الغذاء.</li>
<li><b>الإطار البيئي:</b> الدور الخاص الذي يؤديه المخلوق الحي في موطن معين وضمن ظروف مناسبة. وتتجنب المخلوقات التنافس بامتلاك إطار بيئي مختلف، كطائرين لهما مناقير مختلفة يأكلان أنواعًا مختلفة من الغذاء.</li></ul>
<p><b>التكافل:</b> علاقة ممتدة بين نوعين أو أكثر من المخلوقات الحية يستفيد منها أحدها على الأقل. ومن أشكالها:</p>
<div style="overflow-x:auto"><table border="1" cellpadding="6" style="border-collapse:collapse;min-width:520px"><tr><th>العلاقة</th><th>المعنى</th><th>مثال</th></tr>
<tr><td>تبادل المنفعة</td><td>يستفيد كل منهما من الآخر</td><td>الملقحات والأزهار، النمل وشجرة الأكاسيا، الأشنات (فطر وطحلب)</td></tr>
<tr><td>التعايش</td><td>يستفيد أحدهما دون أن يسبب الأذى للآخر</td><td>الريمورا وسمك القرش، الأوركيدا على الأشجار العالية</td></tr>
<tr><td>التطفل</td><td>مفيدة لطرف ومضرة بالآخر، فيعيش الطفيل على العائل أو داخله</td><td>القراد على جلد الإنسان، الدودة الشريطية</td></tr></table></div>
<h3>الدرس الثاني: التكيف والبقاء</h3>
<p><b>التكيفات</b> خواص تركيبية وسلوكية تساعد المخلوقات الحية على البقاء في بيئاتها، وتورَّث للأجيال اللاحقة.</p>
<ul><li><b>التكيف التركيبي:</b> تغيّر في تراكيب الجسم الداخلية أو الخارجية، مثل لون الفرو والأطراف الطويلة والفكوك القوية. كأرجل البط المسطحة الملتصقة الأصابع للعوم، وخف الجمل المسطح للسير في الصحراء.</li>
<li><b>التكيف السلوكي:</b> تعديل في سلوك المخلوق الحي، كتنقل الذئاب في مجموعات لاصطياد فريسة كبيرة، وتنقل الفرائس في مجموعات للحماية، وهجرة الأسماك والطيور والفراشات.</li></ul>
<p><b>تكيفات النباتات:</b> أزهار عطرة تجذب الملقحات، وأوراق تلتقط ضوء الشمس، وجذور تمتص الماء. والأوركيدا لها أعضاء منتفخة على ساقها تخزن الماء وجذور هوائية. والصبار له ساق سميكة ذات طبقة شمعية تمنع فقدان الماء وجذور كثيفة قريبة من السطح. وتفقد أشجار البلوط أوراقها في الشتاء.</p>
<p><b>تكيفات الحيوانات:</b> كالفراء السميك والدهون في البيئة الباردة، والنشاط ليلًا في الصحراء، والشكل الانسيابي في الماء. وللبوم عينان كبيرتان وأجنحة تكتم صوت الحركة وقدمان بمخالب ضخمة.</p>
<ul><li><b>التمويه:</b> محاكاة الأشكال والألوان الطبيعية في البيئة بحيث يصعب تمييز الحيوان من محيطه. ومنه <b>التلوّن</b> (لون الأرنب القطبي والثعلب القطبي في الثلج) و<b>التشابه</b> (الأفعى أم جنيب تشبه رمال الصحراء).</li>
<li><b>المحاكاة:</b> حماية الحيوان لنفسه بالتشبه بحيوان آخر، كالأفعى الملك التي تحاكي ألوان الأفعى المرجانية السامة. وتستعمل بعض المفترسات المحاكاة لخداع فريستها، كالسلحفاة النهاشة.</li></ul>
<div class="note">للحفظ: التكافل ثلاثة أشكال (تبادل منفعة وتعايش وتطفل)، والتكيف نوعان (تركيبي وسلوكي).</div>`,

summary:`<h3>الدرس الأول: الدورات في الأنظمة البيئية</h3>
<p><b>دورة الماء:</b> حركة الماء المستمرة بين سطح الأرض والهواء، يتحول خلالها من السائلة إلى الغازية ثم إلى السائلة مرة أخرى.</p>
<ul><li><b>التبخر:</b> تحول الماء من السائلة إلى الغازية (بخار يرتفع في الغلاف الجوي) بفعل حرارة الشمس.</li>
<li><b>التكثف:</b> تحول المادة من الغازية إلى السائلة، فتتجمع القطرات وتشكل السحب.</li>
<li><b>الهطول:</b> سقوط القطرات على شكل برد أو ثلج أو مطر.</li>
<li><b>المياه السطحية</b> تتجمع فوق الأرض، و<b>الجارية</b> تتدفق في أودية وأنهار وتصب في البحار والمحيطات، و<b>الجوفية</b> تدخل جوف الأرض وتُختزن في مسامّات التربة والصخور.</li>
<li>تمتص جذور النباتات الماء وتطلقه بالنتح، وتطلق الحيوانات الماء في التنفس.</li></ul>
<p><b>دورة الكربون:</b> الكربون عنصر مهم للمخلوقات الحية، ويوجد في الغلاف الجوي على شكل غاز ثاني أكسيد الكربون. تأخذه النباتات بالبناء الضوئي لتنتج السكر ومركبات أخرى، ثم ينتقل إلى آكلات الأعشاب ثم آكلات اللحوم. ويعود إلى الجو عن طريق تنفس النباتات والحيوانات، وتحلل المخلوقات الميتة بالمحلّلات، وحرق الإنسان للوقود الأحفوري (الغاز الطبيعي والفحم والنفط).</p>
<p><b>دورة النيتروجين:</b> يشكل النيتروجين نحو ثمانية وسبعين في المائة من الهواء، وهو مهم للبروتينات وللمادة الوراثية، لكن القليل من المخلوقات يستطيع استخدامه غازًا. تثبيت النيتروجين يحدث بالنشاط البركاني والبرق وبعض بكتيريا التربة. والبكتيريا المثبتة في العقد الجذرية للبقوليات تحول النيتروجين إلى أمونيا، ثم تحولها بكتيريا التربة إلى نتريت ثم نترات تمتصها النباتات. وتعيد البكتيريا المزيلة للنيتروجين غازه إلى الهواء.</p>
<p><b>إعادة التدوير:</b> الموارد الطبيعية نوعان: متجددة (كالأشجار التي يمكن إعادة زراعتها) وغير متجددة (كالنفط والفلزات). والدُّبال خليط من بقايا مخلوقات حية أو أجسامها بعد موتها وتحللها، ويحسن خصوبة التربة.</p>
<h3>الدرس الثاني: التغيرات في الأنظمة البيئية</h3>
<p>تتغير الأنظمة البيئية بسبب الأحداث الطبيعية (كالزلازل والفيضانات والعواصف والبراكين والجفاف) أو بفعل الإنسان (قطع الأشجار وتلويث الهواء والماء والتربة وإدخال أنواع محددة وإقصاء أخرى). وتغيّر بعض المخلوقات الحية أنظمتها البيئية أيضًا كبناء القندس للسدود وبناء المرجان للشعب المرجانية.</p>
<p><b>الانقراض:</b> يكون معدل موت الأفراد أعلى من الولادات الجديدة، وعندما يموت آخر فرد يصبح النوع <b>منقرضًا</b> (كالديناصورات والثعلب التسماني). من أسبابه: التلوث، الامتداد العمراني، تدمير المواطن، الصيد الجائر. والأنواع المهددة بالانقراض هي التي يتعرض أفرادها لخطر الموت بأعداد كبيرة، كالمها العربي والنمر العربي، وقد أطلقت المملكة حيوانات في محميات طبيعية.</p>
<p><b>التعاقب:</b> تغيّر النظام البيئي إلى نظام جديد مختلف، تحل فيه أنواع محل أنواع كانت تعيش فيها.</p>
<ul><li><b>التعاقب الأولي:</b> يبدأ من صخور جرداء، ثم تظهر الأنواع الرائدة (أشنات وحزازيات) وهي مجتمع الروّاد الحيوي، وتتكون التربة، ثم نباتات صغيرة وأعشاب وشجيرات، ثم المجتمع الوسيط (أشجار وشجيرات صغيرة)، وأخيرًا <b>مجتمع الذروة</b> (الغابة).</li>
<li><b>التعاقب الثانوي:</b> بدء تكوّن مجتمع جديد بدل مجتمع قائم لم تدمّر عناصره تمامًا، وهو أسرع لوجود التربة وبعض المخلوقات، كما في مزرعة مهجورة أو غابة بعد حريق.</li></ul>

<p>ومن مزايا موارد الطاقة المتجددة أنها توفر طاقة نظيفة ولا تلوّث الهواء.</p>
<h3>الدرس الثاني: الهواء والماء</h3>
<p><b>الماء العذب:</b> يغطي الماء نحو سبعين في المائة من سطح الأرض، والمحيطات والبحار مصادره الرئيسة وتحتوي على نحو سبعة وتسعين في المائة من الماء، وهو مالح. معظم الماء العذب متجمد، ومصادره محدودة: الأنهار، البحيرات والخزانات الاصطناعية (السدود)، وخزانات المياه الجوفية. ويُستعمل في المنازل والمزارع والمصانع وتوليد الكهرباء.</p>
<p><b>تلوث المياه:</b> تغيّر في خواصها الفيزيائية والكيميائية والحيوية يجعلها غير صالحة. من أسبابه: المصانع والفضلات والمبيدات والأسمدة الكيميائية ومياه الصرف الصحي. وتُنقّى مياه الصرف في محطات معالجة بمراحل: <b>التصفية</b> (إزالة المواد الكبيرة بالمصافي) ← <b>التخثير</b> (مواد تلتصق بها الأوساخ) ← <b>الترسيب</b> ← <b>الترشيح</b> ← <b>التعقيم</b> (إضافة الكلور لقتل البكتيريا) ← التخزين. ولا تُستعمل المياه المعالجة للشرب، بل لري أنواع معينة من المزروعات. ويُرشّد الاستهلاك بإصلاح الصنابير، وفتح الصنبور عند الاستعمال فقط، والاقتصاد في الاستحمام، وري الحديقة بعد غروب الشمس.</p>
<p><b>تلوث الهواء:</b> يحدث عندما تدخل إلى الهواء مواد غريبة جديدة تغيّر نسب مكوناته. من مصادره: محطات توليد الكهرباء والمصانع ووسائل النقل والاندفاعات البركانية. و<b>الضباب الدخاني</b> خليط من الضباب والدخان، يسببه حرق الوقود الأحفوري، يهيج العيون ويصعّب التنفس ويسبب أمراض الجهاز التنفسي.</p>
<p><b>الأوزون:</b> طبقة تحمي الحياة على الأرض من الأشعة فوق البنفسجية الضارة. تؤدي مركّبات الفريون (الرذاذات وأجهزة التبريد وغيرها) إلى تحلّل الأوزون فيحدث ثقب فوق القطب الجنوبي، فتصل أشعة أكثر إلى الأرض وقد تسبب سرطان الجلد.</p>

   $("#again").onclick=()=>{i=0;sc=0;ans=[];show()};return}
  const q=Q[i];
  b.innerHTML=(sv&&i===0?`<p>آخر نتيجة لك: ${sv.sc} من ${sv.n} (${sv.p}٪)</p>`:"")+`<div class="qbar" aria-hidden="true"><i style="width:${Math.round(i/Q.length*100)}%"></i></div><small>السؤال ${i+1} من ${Q.length}</small><h3>${q.q}</h3>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")+`<div id="fb"></div>`;
  b.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{const k=+btn.dataset.k;ans[i]=k;if(k===q.a)sc++;
   b.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right");else if(x===btn)x.classList.add("wrong")});
   $("#fb").innerHTML=`<p>${q.e}</p><button class="pri" id="nx">${i+1<Q.length?"السؤال التالي":"عرض النتيجة"}</button>`;
   $("#nx").onclick=()=>{i++;show()}});
 }
 if(!Q.length){b.innerHTML=`<div class="note">أسئلة هذا الاختبار قيد المراجعة.</div>`;return}
 show();
}
function route(){const h=decodeURIComponent(location.hash.slice(1));
 if(!h||h==="home")home();else{const m=h.match(/^(c\d)(?:-(\w+))?$/);m?chapter(m[1],m[2]||"summary"):home()}
 window.scrollTo(0,0)}
addEventListener("hashchange",route);progress();route();
</script>
